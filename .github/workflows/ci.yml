name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Cancel superseded runs of the same branch to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Real PostgreSQL+pgvector and Redis, same images as docker-compose.yml.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nexusops
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: nexusops
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexusops -d nexusops"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      # Throwaway CI values; not secrets.
      DATABASE_URL: postgresql+asyncpg://nexusops:ci-only-password@localhost:5432/nexusops
      REDIS_URL: redis://localhost:6379/0
      RUN_INTEGRATION: "1"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
